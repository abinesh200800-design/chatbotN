<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathMind</title>
<style>
:root{--a:#38bdf8;--b:#2563eb;--bg:#07111f;--panel:#0c1b2b;--text:#f8fafc;--muted:#94a3b8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui;background:radial-gradient(circle at 15% 15%,#38bdf838,transparent 28%),radial-gradient(circle at 85% 85%,#2563eb30,transparent 30%),var(--bg);color:var(--text);display:flex;justify-content:center;padding:22px}
.app{width:min(1100px,100%);height:calc(100vh - 44px);display:grid;grid-template-rows:auto 1fr auto;background:#0c1b2be8;border:1px solid #ffffff16;border-radius:28px;overflow:hidden;box-shadow:0 30px 90px #0008}
header{padding:20px 24px;border-bottom:1px solid #ffffff12;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:13px;align-items:center}.logo{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,var(--a),var(--b));font-size:24px}h1{margin:0;font-size:18px}header small{color:var(--muted)}.pill{padding:8px 12px;border:1px solid #ffffff18;border-radius:999px;font-size:10px}
.chat{overflow:auto;padding:30px}.welcome{max-width:680px;margin:65px auto;text-align:center}.hero{font-size:52px;margin-bottom:16px}h2{font-size:clamp(28px,5vw,45px);margin:0 0 12px}.welcome p{color:var(--muted);line-height:1.7}
.msg{display:flex;margin-bottom:18px}.user{justify-content:flex-end}.bubble{max-width:82%;padding:14px 17px;border:1px solid #ffffff12;border-radius:18px;background:#ffffff08;white-space:pre-wrap;line-height:1.65}.user .bubble{background:linear-gradient(135deg,var(--b),var(--a));border:0}
footer{padding:17px 22px;border-top:1px solid #ffffff12}form{display:flex;gap:9px;padding:8px;border:1px solid #ffffff14;border-radius:19px;background:#020a14}textarea{flex:1;min-height:46px;max-height:140px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:12px;font:inherit}button{width:48px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-size:18px;cursor:pointer}
@media(max-width:650px){body{padding:0}.app{height:100vh;border-radius:0}.pill{display:none}.chat{padding:20px 13px}}
</style>
</head>
<body>
<div class="app">

<main>
<header>
<div class="brand"><div class="logo">➗</div><div><h1>MathMind</h1><small>Mathematics study assistant</small></div></div>
<div class="pill">● STUDY MODE</div>
</header>
<section class="chat" id="chat">
<div class="welcome" id="welcome">
<div class="hero">➗</div>
<h2>Learn Mathematics.</h2>
<p>Ask concepts, problems, assignments, revision questions, or exam-preparation questions related to Mathematics.</p>
</div>
</section>
<footer>
<form id="chat-form">
<textarea id="message" rows="1" placeholder="Ask a Mathematics question..." autocomplete="off"></textarea>
<button id="send" type="submit">➤</button>
</form>
</footer>
</main>
</div>
<script>
const form=document.getElementById("chat-form");
const input=document.getElementById("message");
const chat=document.getElementById("chat");
const send=document.getElementById("send");
const welcome=document.getElementById("welcome");

function addMessage(text,role){
 if(welcome) welcome.remove();
 const row=document.createElement("div");
 row.className="msg "+role;
 const bubble=document.createElement("div");
 bubble.className="bubble";
 bubble.textContent=text;
 row.appendChild(bubble);
 chat.appendChild(row);
 chat.scrollTop=chat.scrollHeight;
}

function addTyping(){
 const row=document.createElement("div");
 row.className="msg bot";
 row.id="typing";
 const bubble=document.createElement("div");
 bubble.className="bubble";
 bubble.textContent="Thinking...";
 row.appendChild(bubble);
 chat.appendChild(row);
 chat.scrollTop=chat.scrollHeight;
}

form.addEventListener("submit",async(e)=>{
 e.preventDefault();
 const message=input.value.trim();
 if(!message||send.disabled)return;
 addMessage(message,"user");
 input.value="";
 input.style.height="auto";
 send.disabled=true;
 addTyping();
 try{
  const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});
  const data=await r.json();
  document.getElementById("typing")?.remove();
  addMessage(r.ok?data.reply:(data.error||"Something went wrong."),"bot");
 }catch(err){
  document.getElementById("typing")?.remove();
  addMessage("Unable to connect to the chatbot right now.","bot");
 }finally{send.disabled=false;input.focus();}
});

input.addEventListener("input",()=>{
 input.style.height="auto";
 input.style.height=Math.min(input.scrollHeight,140)+"px";
});
input.addEventListener("keydown",(e)=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit();}
});
</script>
</body>
</html>
